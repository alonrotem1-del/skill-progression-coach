<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today — normal training day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<div class="screen">

  <!-- ── day header ───────────────────────────────────────────────────── -->
  <header class="head">
    <div class="head-text">
      <div class="daylabel">Friday</div>
      <h1 class="daytitle">Home Pull Session</h1>
      <div class="daysub">About 21 min</div>
    </div>
    <!-- PLACEHOLDER day mark. Watercolor wash + graphite contour, 52px.
         Stands in for the commissioned asset; not a library decision. -->
    <div class="daymark">
      <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <ellipse cx="21" cy="43" rx="10.5" ry="10.5" fill="#C9973F" opacity=".13"/>
        <ellipse cx="43" cy="45" rx="10.5" ry="10.5" fill="#B2623C" opacity=".10"/>
        <ellipse cx="32" cy="14" rx="13" ry="5" fill="#C9973F" opacity=".08"/>
        <g fill="none" stroke="#6B665C" stroke-width="1.25" stroke-linecap="round">
          <circle cx="21" cy="43" r="9.2"/>
          <circle cx="43" cy="43" r="9.2"/>
          <path d="M19.5 12.5 C20.2 20 20.6 27 20.9 33.6"/>
          <path d="M44.5 12.5 C43.8 20 43.4 27 43.1 33.6"/>
          <path d="M14 11.5 h11M39 11.5 h11"/>
        </g>
      </svg>
    </div>
  </header>

  <details class="why">
    <summary>Why this?</summary>
    <div class="why-body">Your pulling strength is the limit on the ring muscle-up right
      now, so Friday carries the ladder. Pistols keep the legs moving while you focus there.</div>
  </details>

  <!-- ── what is prescribed ───────────────────────────────────────────── -->
  <div class="list">
    <button class="ex">
      <span class="ex-n">1</span>
      <span class="ex-main">
        <span class="ex-name">Pistol Squat</span>
        <span class="ex-presc">3 &times; 5 each side</span>
      </span>
      <svg class="ex-chev" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="ex">
      <span class="ex-n">2</span>
      <span class="ex-main">
        <span class="ex-name">Pull-Up Ladder</span>
        <span class="ex-presc">1&ndash;2&ndash;3 &times; 5 rounds</span>
      </span>
      <svg class="ex-chev" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="ex">
      <span class="ex-n">3</span>
      <span class="ex-main">
        <span class="ex-name">Toes-to-Bar</span>
        <span class="ex-presc">3 &times; 8 reps</span>
      </span>
      <svg class="ex-chev" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="ex">
      <span class="ex-n">4</span>
      <span class="ex-main">
        <span class="ex-name">Ring Support Hold</span>
        <span class="ex-presc">3 &times; 20 sec hold <span class="q">&middot; optional</span></span>
      </span>
      <svg class="ex-chev" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="ex">
      <span class="ex-n">5</span>
      <span class="ex-main">
        <span class="ex-name">Wrist Roller</span>
        <span class="ex-presc">2 &times; 10 reps <span class="q">&middot; only if forearms feel good</span></span>
      </span>
      <svg class="ex-chev" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ── the one action ───────────────────────────────────────────────── -->
  <div class="actions">
    <button class="primary">Start workout</button>
    <div class="primary-meta">3 required &middot; 2 optional</div>
    <button class="link">Adjust sets</button>
  </div>

  <!-- ── secondary ────────────────────────────────────────────────────── -->
  <div class="secondary">
    <p>Feel like training something else?</p>
    <div class="altrow">
      <button class="link">Any workout</button>
      <button class="link">One exercise</button>
    </div>
  </div>

  <div class="utility">
    <button class="urow">
      <span class="urow-l">Readiness</span>
      <span class="urow-r">Not checked
        <svg width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <button class="urow">
      <span class="urow-l">This week</span>
      <span class="urow-r">
        <svg width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div class="week">
      <div class="wd"><span class="wd-l">Sun</span><span class="wd-t empty"></span></div>
      <div class="wd"><span class="wd-l">Mon</span><span class="wd-t"></span></div>
      <div class="wd"><span class="wd-l">Tue</span><span class="wd-t"></span></div>
      <div class="wd"><span class="wd-l">Wed</span><span class="wd-t"></span></div>
      <div class="wd"><span class="wd-l">Thu</span><span class="wd-t"></span></div>
      <div class="wd today"><span class="wd-l">Fri</span><span class="wd-t"></span></div>
      <div class="wd"><span class="wd-l">Sat</span><span class="wd-t empty"></span></div>
    </div>
  </div>

</div>

<!-- ── bottom navigation ──────────────────────────────────────────────── -->
<nav class="nav">
  <button class="on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>
    Today
  </button>
  <button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="3.3" y="4.8" width="17.4" height="15.4" rx="2.4"/><path d="M3.3 9.6h17.4M8.2 3.2v3M15.8 3.2v3"/></svg>
    Plan
  </button>
  <button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 21V3.6M5.6 4.6h11.2l-2.1 3.9 2.1 3.9H5.6"/></svg>
    Goals
  </button>
  <button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.7"/><path d="M4.8 20.4c0-3.7 3.2-6.2 7.2-6.2s7.2 2.5 7.2 6.2"/></svg>
    Profile
  </button>
</nav>

<script>
  // Lets the review harness swap the primary-button colour for comparison.
  var p = new URLSearchParams(location.search).get('primary');
  if (p) document.documentElement.setAttribute('data-primary', p);
</script>
</body>
</html>
