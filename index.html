<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Skill Progression Coach</title>
  <meta name="description" content="Skill Progression Coach — progression map, today's workout, and skill tracking. A separate installable app that reads Pull-Up Coach data read-only.">
  <!-- Standalone installable PWA on its own GitHub Pages project site
       (/skill-progression-coach/). Its own manifest, icon and service worker.
       Writes only spc_* keys, reads puc_* read-only, and never controls the
       Pull-Up Coach app that lives on the same host. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skill Coach">
  <meta name="theme-color" content="#0b1220">
  <style>
    :root{
      --bg:#0b1220; --panel:#0e2038; --panel2:#12294a; --frame:#e8edf4;
      --card:#16324f; --card2:#1d3e60; --border:#274863; --edge:#2b4f74;
      --text:#eef3fb; --muted:#93a7c4; --dim:#6c82a3;
      --accent:#38bdf8; --accent2:#22d3a6; --focus:#f4b740; --focusglow:#ffd97a;
      --good:#3ddc97; --warn:#f5a524; --bad:#f0616d;
      --radius:16px; --nav-h:60px;
      --world-accent:#38bdf8; --world-glow:#7dd3fc;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans Hebrew',sans-serif;
      font-size:16px;line-height:1.5}
    body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    button{font-family:inherit}
    .app{min-height:100vh}
    .scr{padding:16px 16px 24px;animation:fade .18s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

    h1{font-size:23px;margin-bottom:4px;font-weight:800}
    h2{font-size:19px;margin-bottom:8px;font-weight:800}
    h3{font-size:15px;font-weight:700;margin-bottom:6px}
    .muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11px}
    .en{font-size:.85em;color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center}
    .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .wrap{flex-wrap:wrap}
    .sp{margin-top:14px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
    .card.tight{padding:12px}
    .section{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}
    .btn{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);
      background:var(--card2);color:var(--text);font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
    .btn:active{transform:scale(.99)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#2aa8e0);border-color:transparent;color:#04121f}
    .btn.ghost{background:transparent}
    .btn.sm{padding:9px 12px;font-size:14px;width:auto;margin:0}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .link{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:14px;padding:4px}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);
      border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
    .pill.on{background:var(--accent);border-color:transparent;color:#04121f}
    .pill.warnbtn.on{background:var(--warn);color:#1a1200}
    .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px}
    .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

    /* ---- bottom nav ---- */
    .nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);
      background:rgba(11,18,32,.94);backdrop-filter:blur(10px);border-top:1px solid var(--border);
      display:flex;z-index:50}
    .nav button{flex:1;background:none;border:none;color:var(--dim);font-size:11px;font-weight:700;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
    .nav button.on{color:var(--accent)}
    .nav .ic{width:22px;height:22px}

    /* ---- Today ---- */
    .hero{padding:6px 2px 2px}
    .hero .goal{font-size:13px;color:var(--muted);font-weight:700}
    .rec{background:linear-gradient(150deg,rgba(56,189,248,.16),rgba(56,189,248,.03));
      border:1px solid rgba(56,189,248,.4);border-radius:var(--radius);padding:16px;margin:10px 0}
    .rec .kick{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}
    .rec .name{font-size:21px;font-weight:900;margin-top:3px}
    .rec .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
    .rec .why{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);line-height:1.5}
    .rec .foci{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:var(--card)}
    .tag svg{width:13px;height:13px;flex:none}
    .tag.gold{border-color:var(--focus);color:var(--focusglow)}
    .caution{background:rgba(245,97,109,.12);border:1px solid rgba(245,97,109,.4);border-radius:12px;
      padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.5}
    .rdy-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .rdy-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .rdy-row .lbl{font-size:14px;font-weight:700}
    .seg{display:flex;gap:6px}
    .seg button{border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:10px;
      padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
    .seg button.on{background:var(--accent);border-color:transparent;color:#04121f}
    .seg.warn button.on{background:var(--warn);color:#1a1200}

    /* ---- Map ---- */
    .map-head{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 6px;gap:8px}
    .mh-titles{display:flex;align-items:baseline;gap:8px;min-width:0}
    .mh-focus{display:none}
    .map-title{font-size:20px;font-weight:900}
    .map-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .canvas-inner{position:relative;transform-origin:0 0}
    /* floating map controls + legend popover. Controls float in both
       orientations; the legend '?' button is landscape-only (portrait keeps the
       permanent legend strip below the map). */
    .map-controls{display:flex;position:absolute;right:10px;bottom:10px;z-index:7;flex-direction:column;gap:6px}
    .map-controls [data-legend]{display:none}
    .mc-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
      background:rgba(9,18,32,.72);color:var(--text);font-size:19px;font-weight:800;line-height:1;
      display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);box-shadow:0 3px 10px rgba(0,0,0,.4)}
    .mc-btn svg{width:18px;height:18px}
    .mc-btn:active{transform:scale(.94)}
    .legend-pop{position:absolute;right:56px;bottom:10px;z-index:8;display:flex;flex-direction:column;gap:8px;
      background:rgba(9,18,32,.95);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
      font-size:12px;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .legend-pop[hidden]{display:none}
    .legend-pop .lg{display:flex;align-items:center;gap:6px}
    .legend-pop .sw{width:12px;height:12px;border-radius:4px;border:1.5px solid}
    /* frame is LTR so the world rail sits on the LEFT of the blue canvas
       (matching the references), while node text stays RTL. */
    .map-frame{position:relative;direction:ltr;background:var(--frame);border-radius:20px;padding:10px 0 10px 10px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;overflow:hidden;height:500px}
    /* external world rail — OUTSIDE the blue canvas, overlapping the frame edge */
    .rail{position:relative;z-index:5;display:flex;flex-direction:column;gap:16px;padding:14px 6px;
      align-items:center;justify-content:flex-start}
    .world-ic{position:relative;width:52px;height:52px;border-radius:15px;border:2px solid #c4d0e0;
      background:linear-gradient(160deg,#f4f7fb,#d7e0ec);display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:#5a6b85;box-shadow:0 3px 8px rgba(30,50,80,.25);transition:transform .15s}
    .world-ic svg{width:30px;height:30px}
    .world-ic .wlbl{position:absolute;bottom:-16px;font-size:9px;font-weight:800;color:#5a6b85;white-space:nowrap}
    .world-ic.active{transform:scale(1.14) translateX(6px);border-color:var(--world-accent);
      background:linear-gradient(160deg,#ffffff,#e9f6ff);color:var(--world-accent);
      box-shadow:0 0 0 3px rgba(56,189,248,.35), 0 6px 16px rgba(56,189,248,.5)}
    .world-ic.active::after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);
      width:14px;height:3px;border-radius:2px;background:var(--world-accent)}
    /* the blue pannable canvas */
    .canvas-wrap{position:relative;flex:1;border-radius:14px;overflow:hidden;
      background:radial-gradient(120% 100% at 20% 0%, #143a63 0%, #0e2038 55%, #0a1a30 100%);
      border:1px solid #23456b}
    .canvas-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;cursor:grab;direction:ltr}
    .canvas-scroll.drag{cursor:grabbing}
    .canvas{position:relative;direction:ltr}
    .canvas svg.edges{position:absolute;inset:0;pointer-events:none}
    .node{position:absolute;transform:translate(-50%,-50%);width:118px;
      background:var(--card);border:1.5px solid var(--edge);border-radius:12px;padding:8px 9px;
      cursor:pointer;transition:transform .12s, box-shadow .2s, opacity .2s;text-align:left}
    .node .nm{font-size:12.5px;font-weight:800;line-height:1.2}
    .node .sub{font-size:9.5px;color:var(--muted);margin-top:1px}
    .node .pr{font-size:10.5px;font-weight:800;margin-top:5px;color:var(--muted)}
    .node .dot{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;
      border:2px solid var(--panel);display:flex;align-items:center;justify-content:center}
    .node .dot svg{width:9px;height:9px}
    .node:active{transform:translate(-50%,-50%) scale(.97)}
    /* states */
    .node.locked{opacity:.42;background:#12253c;border-color:#20364f;filter:grayscale(.5)}
    .node.locked .nm{color:#9fb2cc}
    .node.available{border-color:#2f5b82}
    .node.supporting{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(34,211,166,.3)}
    .node.completed{background:#123a52;border-color:#2aa8e0}
    .node.completed .pr{color:var(--accent)}
    .node.maintenance{background:#123a52;border-color:#2aa8e0;opacity:.9}
    .node.current{border-color:var(--focus);background:linear-gradient(160deg,#2a3a3f,#1d3e60);
      box-shadow:0 0 0 2px var(--focus), 0 0 22px 2px rgba(244,183,64,.55);z-index:3}
    .node.current .pr{color:var(--focusglow)}
    .node .foc-lbl{position:absolute;top:-10px;left:8px;background:var(--focus);color:#231600;
      font-size:9px;font-weight:900;padding:1px 6px;border-radius:6px}
    .node.spt-mark::before{content:"";position:absolute;top:6px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--accent2)}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
    .legend .lg{display:flex;align-items:center;gap:5px}
    .legend .sw{width:12px;height:12px;border-radius:4px;border:1.5px solid}

    /* ---- bottom sheet ---- */
    .sheet-back{position:fixed;inset:0;background:rgba(3,8,16,.6);z-index:80;display:flex;align-items:flex-end;
      justify-content:center;animation:fade .15s ease}
    .sheet{width:100%;max-width:520px;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
      border-top:1px solid var(--border);max-height:88vh;overflow:auto;padding:14px 16px 24px;animation:up .22s ease}
    @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
    .sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--edge);margin:2px auto 12px}
    .kv{width:100%;border-collapse:collapse}
    .kv td{padding:7px 2px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
    .kv td:last-child{text-align:right;color:var(--muted)}
    .crit{display:flex;align-items:center;gap:8px;padding:6px 0}
    .crit .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--edge);flex:none;display:flex;align-items:center;justify-content:center}
    .crit.done .ck{background:var(--good);border-color:var(--good)}
    .crit .ck svg{width:11px;height:11px}
    .needs{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.35);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}

    /* ---- workout ---- */
    .wk-top{position:sticky;top:0;background:var(--bg);z-index:10;padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
    .prog{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
    .prog i{display:block;height:100%;background:var(--accent)}
    .set{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px}
    .set.done{border-color:var(--good);background:#123a3a}
    .set .n{width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
    .set .val{flex:1}
    .stepper{display:flex;align-items:center;gap:8px}
    .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:20px;font-weight:800;cursor:pointer}
    .stepper .num{min-width:34px;text-align:center;font-weight:800;font-size:17px}
    .timer{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:10px}
    .timer .t{font-size:38px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
    .flag{display:flex;gap:8px;align-items:center;margin-top:10px}

    /* climbing */
    .prob{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px}
    .prob .ph{display:flex;justify-content:space-between;align-items:center}
    .grade-pick{display:flex;gap:6px;flex-wrap:wrap}
    .input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:15px;font-family:inherit}
    textarea.input{min-height:52px;resize:vertical}

    .unlock{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(3,8,16,.72);animation:fade .2s}
    .unlock .box{background:linear-gradient(160deg,#1d3e60,#123a52);border:1px solid var(--focus);border-radius:20px;padding:26px 24px;text-align:center;max-width:340px;box-shadow:0 0 40px rgba(244,183,64,.4);animation:up .28s ease}
    .unlock .ring{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:rgba(244,183,64,.15);display:flex;align-items:center;justify-content:center}
    .unlock .ring svg{width:34px;height:34px;color:var(--focus)}
    .chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding:8px 0}
    .chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),#1c6fa0);border-radius:4px 4px 0 0;min-height:3px;position:relative}
    .chart .bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
    .chart .bar em{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);font-style:normal}

    /* ---- workout preview ---- */
    .preview{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .prev-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:8px}
    .prev-ex{font-weight:700;font-size:14px}

    /* ---- dynamic adaptation ---- */
    .adapt-card{background:linear-gradient(150deg,rgba(244,183,64,.10),rgba(244,183,64,.03));
      border:1px solid rgba(244,183,64,.4);border-radius:var(--radius);padding:12px;margin:8px 0}
    .adapt-opts{gap:8px}
    .adapt-note{padding:2px 0 6px;font-style:italic}
    .adapt-card.override{background:var(--card);border-color:var(--border)}
    .current-set{border-color:var(--focus)!important;box-shadow:0 0 0 1px var(--focus)}

    /* ---- current-action-first runner ---- */
    .cur-card{background:linear-gradient(160deg,rgba(56,189,248,.10),rgba(56,189,248,.02));
      border:1px solid var(--accent);border-radius:16px;padding:14px;margin:6px 0 4px}
    .cur-meta{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-weight:800}
    .cur-target{font-size:22px;font-weight:800;margin:4px 0 2px}
    .cur-card .set{background:transparent;border:none;padding:6px 0 0;margin:0;justify-content:space-between;flex-wrap:wrap}
    .stepper.big button{width:44px;height:44px;font-size:24px}
    .stepper.big .num{min-width:48px;font-size:26px}
    .cur-done{flex:0 0 auto;width:auto;min-width:120px;margin:0;padding:13px 22px;font-size:16px}
    .cur-next{margin-top:10px}
    .round-overview{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
    .round-chip{display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-radius:10px;
      background:var(--card);border:1px solid var(--border);min-width:66px}
    .round-chip .rc-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim)}
    .round-chip .rc-steps{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
    .round-chip.done{border-color:var(--good);background:#123a3a}
    .round-chip.done .rc-steps{color:var(--good)}
    .round-chip.current{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
    .round-chip.current .rc-steps{color:var(--focus)}
    .round-chip.upcoming{opacity:.72}
    .round-chip.skipped{opacity:.5;text-decoration:line-through}

    /* ---- timed hold runner ---- */
    .hold-card{text-align:center}
    .hold-target{font-size:15px;color:var(--muted);margin:2px 0 10px}
    .hold-big{font-size:64px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;margin:4px 0 12px}
    .hold-prep .hold-big{color:var(--focus)}
    .hold-progress{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin:0 0 14px}
    .hold-progress i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
    .hold-btns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
    .hold-btns .btn{width:100%}
    .hold-result{font-size:17px;font-weight:800;margin-bottom:12px}
    .hold-start{width:100%}
    .hold-edit-link{display:block;margin-top:8px}
    .hold-idle-acts{display:flex;justify-content:center;gap:18px;margin-top:10px}

    /* ---- path summary ---- */
    .path-summary{font-size:13px;color:var(--muted);margin:4px 0 6px}

    /* ---- rest timer pulse ---- */
    .ready-pulse{animation:pulse 1s ease infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    /* ---- timer controls ---- */
    .timer-btns{display:flex;gap:16px;justify-content:center;margin-top:8px}

    /* ---- danger button ---- */
    .btn.danger{background:rgba(240,97,109,.15);border-color:rgba(240,97,109,.4);color:var(--bad)}

    /* ---- Today workout exercise list ---- */
    .wk-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .wk-ex{padding:8px 0;border-bottom:1px solid rgba(39,72,99,.5);cursor:pointer}
    .wk-ex:last-child{border-bottom:none}
    .wk-ex-h{display:flex;align-items:center;gap:8px}
    .wk-ex-n{width:22px;height:22px;flex:none;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
    .wk-ex-nm{font-weight:700;flex:1}
    .wk-ex-info{font-size:12px;color:var(--accent);font-weight:700}
    .wk-ex-struct{margin:2px 0 0 30px;font-size:14px}
    .wk-ex-rest{margin-left:30px}
    .modified-flag{margin-top:8px;font-size:12px;color:var(--focus);font-weight:700}
    .inline-edit{margin-top:10px}

    /* ---- weekly plan: Today scheduled card, priorities, adaptation ---- */
    .rec.sched .name{font-size:20px}
    .sched-goal{margin-top:6px;font-size:14px;color:var(--muted)}
    .sched-goal b{color:var(--text)}
    .prio{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
      padding:0 5px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.02em}
    .prio-A{background:rgba(56,189,248,.2);color:#7dd3fc}
    .prio-B{background:rgba(34,211,166,.18);color:#6ee7c7}
    .prio-C{background:rgba(148,163,184,.18);color:#c7d2de}
    .prio-D{background:rgba(148,163,184,.10);color:var(--dim)}
    .adapt-banner{margin:10px 0 4px;padding:10px 12px;border-radius:12px;
      background:linear-gradient(150deg,rgba(244,183,64,.12),rgba(244,183,64,.03));border:1px solid rgba(244,183,64,.4)}
    .adapt-cause{font-size:13px;color:var(--muted);margin-top:4px}
    .asplanned{margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--good)}
    .pl-ex{padding:8px 0;border-bottom:1px solid rgba(39,72,99,.5)}
    .pl-ex:last-child{border-bottom:none}
    .exec-preview{margin-top:4px}
    .ex-off{opacity:.6}
    .ex-off .wk-ex-nm{text-decoration:line-through}
    .wk-ex-n.off{background:transparent;color:var(--dim)}
    /* status chips on Today's plan items */
    .status-chip{flex:none;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;text-transform:uppercase;letter-spacing:.02em}
    .sc-required{background:rgba(56,189,248,.16);color:#7dd3fc}
    .sc-optional{background:rgba(148,163,184,.16);color:#c7d2de}
    .sc-conditional{background:rgba(244,183,64,.16);color:var(--focus)}
    .sc-replaced{background:rgba(122,162,247,.18);color:#a9c0ff}
    .sc-skipped,.sc-removed{background:rgba(245,97,109,.15);color:#f5919b}
    /* Daily-workout exercise queue (Today) */
    .queue{margin:6px 0 4px}
    .q-ex{padding:9px 0;border-bottom:1px solid rgba(39,72,99,.5)}
    .q-ex:last-child{border-bottom:none}
    .q-ex.q-done{opacity:.72}
    .q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .q-name{background:none;border:none;color:var(--text);font-weight:700;font-size:15px;padding:0;cursor:pointer;text-align:left;flex:1;min-width:120px}
    .q-ex.q-done .q-name{text-decoration:line-through;text-decoration-color:var(--dim)}
    .q-ex.ex-off .q-name{text-decoration:line-through;color:var(--dim)}
    .q-presc{margin:3px 0 0 30px}
    .q-actions{display:flex;align-items:center;gap:10px;margin:7px 0 0 30px;flex-wrap:wrap}
    .q-sub{margin:4px 0 0 30px}
    .q-ex.q-base{background:rgba(56,189,248,.06);border-radius:10px;padding:9px 8px;margin:2px 0}
    .q-ex.q-base .wk-ex-n{color:var(--accent)}
    .btn.sm{padding:7px 14px;font-size:13px;width:auto;margin:0}
    /* Exercise-complete + daily summary */
    .sp{margin-top:8px}
    .ladder-done{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);border-radius:12px;padding:12px;margin:8px 0}

    /* Progress: weekly summary + history */

    .sum-ct{font-weight:800;font-variant-numeric:tabular-nums}

    .sum-bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:5px}
    .sum-bar i{display:block;height:100%;background:var(--accent)}

    .hist-filters{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}
    .hist-fchip{flex:none;background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}

    .hist-h{display:flex;align-items:center;gap:8px;cursor:pointer}

    .hist-nm{font-weight:800;flex:1}
    .hist-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .hist-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;background:var(--card2);color:var(--muted);border-radius:6px;padding:1px 6px}
    .hist-body{margin-top:8px;border-top:1px solid rgba(39,72,99,.4);padding-top:8px}
    .hist-ex{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
    .hist-ex span{color:var(--muted)}
    .hist-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
    .hist-badge{font-size:10px;font-weight:800;text-transform:uppercase;background:rgba(148,163,184,.16);color:#c7d2de;border-radius:6px;padding:1px 6px}

    /* Ad-hoc workout entry points + chooser/builder */

    .chooser-row .cr-name{flex:1;font-weight:700}
    .chooser-row .sr-arrow{color:var(--dim);font-size:18px}
    .cls-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .cls-opts .btn{width:auto;flex:1;min-width:120px;margin:0}
    .bld-list{display:flex;flex-direction:column;gap:6px}
    .bld-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
    .bld-move{display:flex;gap:8px}

    .chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}

    /* Edit Plan editor */

    .ep-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
    .ep-row-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    .ep-sub{margin:3px 0 8px}

    .ep-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .ep-days{display:flex;gap:4px}

    .ep-status.link{padding:0 2px;font-size:11px}

    .ep-warns.acked{background:transparent;border-color:transparent;padding:2px 0}
    .ep-warns .ep-warnline{border-bottom:none;color:var(--focusglow);padding:2px 0}

    .ep-bchip{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px}

    /* week-at-a-glance strip on Today */
    .wk-strip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    .wk-day-chip{flex:1;min-width:52px;display:flex;flex-direction:column;gap:2px;align-items:center;
      background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:7px 4px;cursor:pointer;color:var(--text)}
    .wk-day-chip.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
    .wk-day-chip.done{border-color:var(--good)}
    .wk-day-chip.adapted{border-color:var(--focus)}
    .wk-day-chip .wdc-d{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}

    /* ---- Week screen ---- */

    .wd-day{font-weight:800;font-size:15px}

    .wd-item{display:flex;align-items:center;gap:6px;font-size:13px}
    .wd-adapt{margin-top:8px;font-size:12px;color:var(--focus);font-weight:700}
    .wd-badge{flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px}
    .wd-badge.done{background:#123a3a;color:var(--good)}
    .wd-badge.adapted{background:rgba(244,183,64,.15);color:var(--focus)}
    .wd-badge.pending{background:rgba(56,189,248,.15);color:var(--accent)}
    .wd-badge.rest{background:var(--card2);color:var(--dim)}

    /* day-detail sheet bits */
    .dd-ex{padding:8px 0;border-bottom:1px solid rgba(39,72,99,.5)}
    .dd-ex:last-child{border-bottom:none}
    .dd-ex-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .dd-ex-h b{flex:1;min-width:0}
    .dd-kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid rgba(39,72,99,.4)}
    .dd-kv span{color:var(--muted)}
    .dd-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
    .group-moves{gap:6px}

    /* ---- settings hub ---- */
    .settings-list{margin-top:10px}
    .settings-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
      border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;color:var(--text)}
    .settings-row.static{cursor:default}
    .settings-row .sr-main{flex:1;min-width:0}
    .sr-title{font-weight:700;font-size:15px}
    .sr-arrow{color:var(--dim);font-size:22px;font-weight:700;flex:none}
    .chip-mod{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--focus);
      border:1px solid var(--focus);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}

    /* ---- toggle switch ---- */
    .toggle{flex:none;width:46px;height:28px;border-radius:999px;border:1px solid var(--border);background:var(--card2);
      position:relative;cursor:pointer;transition:background .15s}
    .toggle .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#8fa5c2;transition:left .15s,background .15s}
    .toggle.on{background:var(--accent);border-color:transparent}
    .toggle.on .knob{left:20px;background:#04121f}

    /* ---- key/value rows (exercise detail) ---- */
    .kv-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(39,72,99,.5);font-size:14px}

    .ed-dur{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
    .ed-block{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:10px}
    .ed-block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .ed-block-nm{font-weight:800}

      padding:9px 10px;font-size:15px;font-family:inherit;text-align:center}
    .ed-field.wide .ed-in{width:100%;text-align:left}
    .toggle-field{margin-top:2px}
    .ed-actions{margin-top:16px}

    /* ==========================================================================
       LANDSCAPE-FIRST PHONE LAYOUT
       Targets a real phone held sideways (wide, short viewport). The trigger is
       deliberately NOT a single fixed breakpoint — it fires when the viewport is
       landscape AND either short (≤680px, covering every common Samsung landscape
       height ~360–412) OR a touch device up to a tall foldable (≤900px, coarse
       pointer). `orientation: landscape` already implies width > height. Desktop
       windows (tall, fine pointer) are excluded, so portrait behavior/tests are
       unaffected. Everything above this block is the untouched portrait layout.
       ========================================================================== */
    @media (orientation: landscape) and (max-height: 680px),
           (orientation: landscape) and (pointer: coarse) and (max-height: 900px) {
      body{max-width:none}
      /* the nav is a left rail here, not a bottom bar — reclaim the bottom
         padding that was reserved for it so short viewports get every
         pixel of vertical room */
      body{padding-bottom:env(safe-area-inset-bottom)}
      .scr{max-width:1180px;margin:0 auto;padding:14px 22px 22px}
      /* Reserve room for the side nav rail only on screens that actually show
         one (workout/editor screens render without .nav and stay full-width). */
      .scr:has(+ .nav){padding-left:calc(76px + env(safe-area-inset-left))}

      /* ---- side nav rail instead of a bottom bar: reclaims the short axis.
         Anchored to the physical left edge with the notch/curved-edge inset
         folded in as padding (border-box) so icons never sit under it. */
      .nav{position:fixed;left:0;top:0;right:auto;bottom:0;width:calc(64px + env(safe-area-inset-left));height:100vh;max-width:none;margin:0;
        flex-direction:column;border-top:none;border-right:1px solid var(--border);
        padding:calc(env(safe-area-inset-top) + 10px) 0 10px env(safe-area-inset-left);justify-content:flex-start;gap:6px}
      .nav button{flex:none;padding:10px 0}

      /* ---- Today: dominant recommendation on the left, secondary on the right */
      .today-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
      .today-right{display:flex;flex-direction:column;min-width:0}

      /* ---- Immersive Map: the canvas becomes the primary surface (~85%+ of the
         short landscape viewport). Permanent chrome is minimised — the big
         heading collapses to a ~34px toolbar, the legend moves into a floating
         popover, and all map controls float over the canvas. Uses 100dvh +
         safe-area insets so it tracks the real Samsung landscape viewport. */
      .scr:has(.map-frame){padding-top:4px;padding-bottom:4px}
      .map-head{margin:0 0 4px;min-height:32px;align-items:center}
      .map-head .map-title{font-size:15px}
      .map-head .mh-portrait-sum{display:none}
      .map-head .mh-focus{display:inline;font-size:12px;color:var(--muted);margin-left:8px}
      .map-head .mh-center{display:none}
      .map-frame{height:calc(100dvh - 46px - env(safe-area-inset-top));padding:4px 0 4px 4px}
      .legend{display:none}                 /* no permanent legend below the map */
      .map-controls{display:flex}            /* floating overlay controls */
      .map-controls [data-legend]{display:flex}  /* legend button is landscape-only */
      .rail{position:absolute;left:2px;top:6px;z-index:6;gap:10px;padding:6px 2px;
        background:rgba(9,18,32,.55);border-radius:14px;backdrop-filter:blur(3px)}
      .rail .world-ic{width:38px;height:38px;border-radius:11px}
      .rail .world-ic svg{width:22px;height:22px}
      .rail .world-ic.active{transform:scale(1.06)}
      .rail .world-ic.active::after{display:none}
      .canvas-wrap{margin-left:0}

      /* ---- Node / exercise detail: side panel instead of a bottom sheet */
      .sheet-back{align-items:stretch;justify-content:flex-end}
      .sheet{max-width:400px;width:44vw;min-width:300px;height:100%;max-height:100vh;
        border-radius:0;border-top:none;border-left:1px solid var(--border);animation:slideIn .18s ease;
        padding-right:calc(16px + env(safe-area-inset-right));overflow-y:auto}
      @keyframes slideIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

      /* ---- Active workout: current exercise/target/Done on the left
         (.wk-body); rest timer, next action, compact round overview and
         adaptation controls on the right (.wk-side). These are two
         independently-stacking columns — like .today-left/.today-right —
         not a shared CSS-grid row, so a tall rest timer on the right can
         never push the left column's current target down the page. .flag
         and the finish button span both columns underneath. */
      .wk-runner-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
      .wk-body,.wk-side{display:flex;flex-direction:column;gap:10px;min-width:0}
      .wk-runner-body>.flag,.wk-runner-body>[data-finish]{grid-column:1/-1}
      .wk-block-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
      .wk-block-wrap .section{margin-top:0}
      .wk-block-wrap.wk-block-current{border-color:var(--accent)}
      /* current target + timer both land at the top of their own column and
         must stay reachable without scrolling on short landscape viewports */
      #rest:empty{display:none}
      /* At half the (already narrow) landscape width, the stepper + Done
         button were wide enough to wrap onto a second line, which was
         enough extra height to push the timer below the fold on the
         shortest supported viewports (e.g. 740x360) — trim them down. */
      .cur-card{padding:10px 12px}
      .cur-done{min-width:96px;padding:11px 16px;font-size:15px}
      .stepper.big button{width:38px;height:38px;font-size:20px}
      .stepper.big .num{min-width:38px;font-size:22px}
      /* the hold countdown is the single most important number on screen, but
         at this width/height it still has to leave room for its buttons */
      .hold-big{font-size:44px;margin:2px 0 8px}
      .hold-btns{gap:6px}

      /* ---- Climbing session: logging on the left, log + summary on the right */
      .climb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
      .climb-left,.climb-right{min-width:0}

      /* ---- Workout editor: one block per column instead of a long list */
      .ed-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

      /* ---- Week: use the width — three day-columns instead of one tall list */
      .week-grid{grid-template-columns:repeat(3,1fr);gap:12px}

      /* ---- Progress: stats/chart beside recent activity */
      .progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

      /* ---- Settings hub / Exercise Library / Workout Defaults: reflow the
         simple row-list into two columns instead of one tall scroll. */
      .settings-list{column-count:2;column-gap:14px}
      .settings-list .settings-row{break-inside:avoid-column;margin-top:0;margin-bottom:8px}
      .settings-list .section{break-after:avoid-column;break-inside:avoid-column}
    }

    /* ---- Portrait fallback (Part 1D): one concise, non-blocking rotation
       option with a real "Enter Landscape" action. It sits in normal flow
       above the app (pushing it down, never covering it), is scoped to
       phone-sized portrait viewports only, and is fully dismissible — once
       dismissed it consumes no space. It never blocks the app. */
    .rotate-hint{display:none}
    @media (orientation: portrait) and (max-width: 820px) {
      .rotate-hint:not(.dismissed){display:flex;align-items:center;gap:10px;
        background:var(--accent);color:#04202f;font-size:13px;font-weight:700;
        padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
      .rotate-hint .rh-msg{flex:1;min-width:0}
      .rotate-hint .rh-go{flex:none;background:#04202f;color:#fff;border:none;border-radius:8px;
        font:inherit;font-weight:700;padding:7px 12px;cursor:pointer}
      .rotate-hint .rh-x{flex:none;background:none;border:none;color:inherit;font-size:18px;
        line-height:1;padding:2px 6px;cursor:pointer}
    }
    .rotate-hint.dismissed{display:none}
  </style>
</head>
<body>
  <div id="rotateHint" class="rotate-hint" role="status">
    <span class="rh-msg" id="rotateHintMsg">&#8635; This app is designed for landscape.</span>
    <button type="button" class="rh-go" id="rotateHintGo">Enter Landscape</button>
    <button type="button" class="rh-x" id="rotateHintClose" aria-label="Dismiss">&times;</button>
  </div>
  <div id="app" class="app"><div class="scr"><p class="muted">Loading…</p></div></div>
  <script>
    // Register this app's OWN service worker, scoped to this project site
    // (/skill-progression-coach/). It never controls the Pull-Up Coach app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
      });
    }
    // Capture the install prompt so Settings can offer a manual install action.
    window.__spcInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__spcInstallPrompt = e;
      window.dispatchEvent(new Event('spc-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__spcInstallPrompt = null;
      window.dispatchEvent(new Event('spc-installed'));
    });
    // ---- Real landscape support (Part 1) --------------------------------
    // The manifest already requests orientation "landscape-primary". This adds
    // the Screen Orientation API flow. It is honest: it only reports success
    // when the browser actually accepted the lock, and it never leaves the UI
    // broken when the request is rejected (common in a normal browser tab).
    (function () {
      var api = (typeof screen !== 'undefined' && screen.orientation) ? screen.orientation : null;
      function isStandalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;
      }
      // Attempt a lock, requesting fullscreen first only where it's needed to
      // make the lock succeed (a plain tab usually can't lock without it).
      function enterLandscape(opts) {
        opts = opts || {};
        return new Promise(function (resolve) {
          function tryLock() {
            // Re-read the lock function each call so tests can stub it.
            var lock = api && api.lock;
            if (!lock) { resolve({ locked: false, reason: 'unsupported' }); return; }
            var p;
            try { p = api.lock('landscape-primary'); }
            catch (e) { resolve({ locked: false, reason: (e && e.message) || 'rejected' }); return; }
            Promise.resolve(p).then(
              function () { resolve({ locked: true }); },
              function (err) { resolve({ locked: false, reason: (err && err.message) || 'rejected' }); }
            );
          }
          if (opts.fullscreen && document.documentElement.requestFullscreen && !document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(tryLock, tryLock);
          } else { tryLock(); }
        });
      }
      window.SPC_landscape = {
        isStandalone: isStandalone,
        supported: !!(api && api.lock),
        attemptedStandaloneLock: false,
        enter: enterLandscape
      };
      // On an installed (standalone) launch, attempt a silent lock. Safe: any
      // rejection is swallowed and the app continues normally.
      if (isStandalone() && api && api.lock) {
        window.SPC_landscape.attemptedStandaloneLock = true;
        try { Promise.resolve(api.lock('landscape-primary')).catch(function () {}); } catch (e) { /* ignore */ }
      }
      // Portrait fallback control — a real user-initiated action, reported honestly.
      var hint = document.getElementById('rotateHint');
      var go = document.getElementById('rotateHintGo');
      var msg = document.getElementById('rotateHintMsg');
      var close = document.getElementById('rotateHintClose');
      if (close) close.addEventListener('click', function () { hint.classList.add('dismissed'); });
      if (go) go.addEventListener('click', function () {
        go.disabled = true;
        enterLandscape({ fullscreen: true }).then(function (res) {
          if (res.locked) { hint.classList.add('dismissed'); }
          else {
            // Do NOT pretend the device rotated — give concise manual guidance.
            msg.textContent = '↻ Your browser can’t auto-rotate here — turn your phone sideways.';
            go.style.display = 'none';
          }
        });
      });
    })();
  </script>

  <script src="adapt.js?v=20260801a"></script>
  <script src="settings.js?v=20260801a"></script>
  <script src="app.js?v=20260801a"></script>
